<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Мессенджер</title>
<style>
  :root { --bg:#0e1621; --panel:#17212b; --line:#243240; --text:#e8eef4; --muted:#7f91a4;
          --accent:#4c9ce2; --mine:#2b5278; --theirs:#182533; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  button,input { font:inherit; color:inherit; }
  input { background:#0e1621; border:1px solid var(--line); border-radius:10px; padding:12px 14px; width:100%; outline:none; }
  input:focus { border-color:var(--accent); }
  button { cursor:pointer; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:#fff; font-weight:600; }
  button.ghost { background:transparent; color:var(--accent); }
  .hidden { display:none !important; }

  /* вход */
  #auth { min-height:100%; display:grid; place-items:center; padding:20px; }
  .card { width:100%; max-width:380px; background:var(--panel); border-radius:16px; padding:24px; display:grid; gap:12px; }
  .card h1 { font-size:22px; text-align:center; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .tabs button { background:#0e1621; color:var(--muted); }
  .tabs button.on { background:var(--accent); color:#fff; }
  .err { color:#ff7b7b; font-size:14px; min-height:18px; }
  .hint { color:var(--muted); font-size:13px; }
  .keybox { background:#0e1621; border:1px dashed var(--accent); border-radius:10px; padding:14px; text-align:center;
            font:600 15px ui-monospace,Menlo,monospace; word-break:break-all; user-select:all; }
  .langBtn { padding:6px 10px; font-size:14px; white-space:nowrap; }

  /* приложение */
  #app { height:100%; display:grid; grid-template-columns:340px 1fr; }
  #side { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .me { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
  .me .who { flex:1; min-width:0; }
  .me b, .me small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  small { color:var(--muted); }
  .search { padding:10px 12px; }
  #list { overflow:auto; flex:1; }
  .item { display:flex; gap:12px; padding:10px 14px; cursor:pointer; align-items:center; }
  .item:hover, .item.on { background:#202b36; }
  .ava { width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center; font-weight:700; color:#fff; }
  .item .t { min-width:0; flex:1; }
  .item .t b, .item .t small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { background:var(--accent); border-radius:12px; padding:0 8px; font-size:13px; font-weight:700; }
  .label { padding:8px 14px; color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em; }

  #chat { display:flex; flex-direction:column; min-height:0; min-width:0; }
  .head { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  .head .back { display:none; padding:6px 10px; background:transparent; font-size:20px; color:var(--accent); }
  #msgs { flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:6px; }
  .m { max-width:min(75%,520px); padding:8px 12px; border-radius:14px; background:var(--theirs); align-self:flex-start; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; }
  .m.mine { background:var(--mine); align-self:flex-end; }
  .m time { display:block; text-align:right; font-size:11px; color:var(--muted); margin-top:2px; }
  .empty { margin:auto; color:var(--muted); text-align:center; padding:20px; }
  form.send { display:flex; gap:8px; padding:10px; background:var(--panel); border-top:1px solid var(--line); padding-bottom:max(10px, env(safe-area-inset-bottom)); }

  /* звонки */
  .head .callbtn { margin-left:auto; padding:8px 12px; background:transparent; font-size:20px; }
  .head .callbtn:hover { background:#202b36; }
  #call { position:fixed; inset:0; z-index:50; background:rgba(14,22,33,.97); display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px; }
  #call .ava { width:110px; height:110px; font-size:44px; }
  #call h2 { font-size:24px; }
  #call .st { color:var(--muted); }
  .cbtns { display:flex; gap:22px; margin-top:20px; }
  .cbtns button { width:64px; height:64px; border-radius:50%; font-size:26px; padding:0; }
  .cbtns .red { background:#e5484d; }
  .cbtns .green { background:#2fb344; }
  .cbtns .mute { background:#2b3a4a; }
  .cbtns .mute.on { background:#fff; color:#000; }
  @media (max-width:760px) {
    #app { grid-template-columns:1fr; }
    #chat { display:none; }
    #app.chatting #side { display:none; }
    #app.chatting #chat { display:flex; }
    .head .back { display:block; }
  }
</style>
</head>
<body>

<!-- ВХОД / РЕГИСТРАЦИЯ -->
<div id="auth">
  <div class="card">
    <div style="text-align:right"><button class="ghost langBtn langFull" type="button"></button></div>
    <h1 data-i="appName"></h1>
    <div class="tabs">
      <button id="tabReg" class="on" data-i="tabReg"></button>
      <button id="tabLogin" data-i="tabLogin"></button>
    </div>

    <form id="regForm" style="display:grid;gap:10px">
      <input id="rName" data-ph="phName" maxlength="40" autocomplete="given-name" required>
      <input id="rSurname" data-ph="phSurname" maxlength="40" autocomplete="family-name">
      <input id="rUser" data-ph="phUser" maxlength="21" autocapitalize="off" autocomplete="username" required>
      <button data-i="btnReg"></button>
    </form>

    <form id="loginForm" class="hidden" style="display:grid;gap:10px">
      <input id="lKey" data-ph="phKey" autocapitalize="characters" required>
      <button data-i="btnLogin"></button>
      <div class="hint" data-i="loginHint"></div>
    </form>
    <div class="err" id="authErr"></div>
  </div>
</div>

<!-- ПОКАЗ КЛЮЧА ПОСЛЕ РЕГИСТРАЦИИ -->
<div id="keyScreen" class="hidden" style="min-height:100%;display:grid;place-items:center;padding:20px">
  <div class="card">
    <h1 data-i="keyTitle"></h1>
    <div class="keybox" id="keyText"></div>
    <div class="hint" data-i="keyWarn"></div>
    <button id="copyKey" class="ghost" data-i="copy"></button>
    <button id="keyDone" data-i="keyDone"></button>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="me">
      <div class="ava" id="meAva"></div>
      <div class="who"><b id="meName"></b><small id="meUser"></small></div>
      <button class="ghost langBtn langShort" type="button"></button>
      <button class="ghost" id="logout" data-i="logout"></button>
    </div>
    <div class="search"><input id="q" data-ph="phSearch" autocapitalize="off"></div>
    <div id="list"></div>
  </aside>
  <section id="chat">
    <div class="empty" id="noChat" data-i="noChat"></div>
    <div id="chatBox" style="display:none;flex-direction:column;flex:1;min-height:0">
      <div class="head">
        <button class="back" id="back">←</button>
        <div class="ava" id="hAva" style="width:38px;height:38px"></div>
        <div><b id="hName"></b><br><small id="hUser"></small></div>
        <button class="callbtn" id="callBtn" data-tt="callTitle">📞</button>
      </div>
      <div id="msgs"></div>
      <form class="send" id="sendForm">
        <input id="text" data-ph="phMsg" autocomplete="off" maxlength="4000">
        <button>➤</button>
      </form>
    </div>
  </section>
</div>

<!-- ЗВОНОК -->
<div id="call" class="hidden">
  <div class="ava" id="cAva"></div>
  <h2 id="cName"></h2>
  <div class="st" id="cStatus"></div>
  <div class="cbtns">
    <button class="green hidden" id="cAccept" data-tt="acceptTitle">📞</button>
    <button class="mute hidden" id="cMute" data-tt="muteTitle">🎤</button>
    <button class="red" id="cEnd" data-tt="endTitle">✖</button>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
const $ = id => document.getElementById(id);

/* ---------- языки: русский и узбекский (латиница) ---------- */
const I18N = {
  ru: {
    title: 'Мессенджер', appName: '💬 Мессенджер', tabReg: 'Регистрация', tabLogin: 'Вход по ключу',
    phName: 'Имя', phSurname: 'Фамилия (необязательно)', phUser: 'Юзернейм, например ivan_2007',
    btnReg: 'Зарегистрироваться', phKey: 'Ключ доступа XXXX-XXXX-…', btnLogin: 'Войти',
    loginHint: 'Ключ выдаётся при регистрации. Он нужен, чтобы зайти с другого устройства.',
    keyTitle: 'Твой ключ доступа',
    keyWarn: '⚠️ Сохрани его (скриншот или заметка). Пароля нет — ключ единственный способ зайти с нового телефона или после очистки браузера. Потерял — аккаунт потерян.',
    copy: 'Скопировать', copied: 'Скопировано ✓', keyDone: 'Я сохранил, продолжить',
    logout: 'Выйти', logoutConfirm: 'Выйти? Сохрани ключ доступа, иначе не сможешь вернуться.',
    phSearch: 'Найти по @юзернейму или имени', noChat: 'Выбери чат слева или найди друга по юзернейму',
    phMsg: 'Сообщение', emptyChats: 'Пока нет чатов. Найди друга по юзернейму выше 👆',
    searchResults: 'Результаты поиска', nobody: 'Никого не нашли', firstMsg: 'Напиши первое сообщение 👋', you: 'Вы: ',
    callTitle: 'Позвонить', acceptTitle: 'Принять', muteTitle: 'Выключить микрофон', endTitle: 'Завершить',
    callOut: 'Вызов…', callIn: 'Входящий звонок…', connecting: 'Соединение…', offline: 'Пользователь не в сети',
    noAnswer: 'Нет ответа', ended: 'Звонок завершён', missed: 'Пропущенный звонок', rejected: 'Звонок отклонён',
    busy: 'Занято', failed: 'Не удалось соединиться', lost: 'Связь потеряна', callErr: 'Ошибка звонка',
    needHttps: 'Для звонков нужен защищённый адрес (https) или localhost',
    noMic: 'Нет доступа к микрофону. Разреши его в браузере.', netErr: 'Нет связи с сервером', error: 'Ошибка',
    callTab: '📞 Звонок!', other: "O'zbekcha", otherShort: 'UZ'
  },
  uz: {
    title: 'Messenjer', appName: '💬 Messenjer', tabReg: "Ro'yxatdan o'tish", tabLogin: 'Kalit bilan kirish',
    phName: 'Ism', phSurname: 'Familiya (ixtiyoriy)', phUser: 'Foydalanuvchi nomi, masalan ivan_2007',
    btnReg: "Ro'yxatdan o'tish", phKey: 'Kirish kaliti XXXX-XXXX-…', btnLogin: 'Kirish',
    loginHint: "Kalit ro'yxatdan o'tishda beriladi. U boshqa qurilmadan kirish uchun kerak.",
    keyTitle: 'Sizning kirish kalitingiz',
    keyWarn: "⚠️ Uni saqlab qo'ying (skrinshot yoki eslatma). Parol yo'q — kalit yangi telefondan yoki brauzer tozalangandan keyin kirishning yagona yo'li. Yo'qotsangiz, akkaunt ham yo'qoladi.",
    copy: 'Nusxalash', copied: 'Nusxalandi ✓', keyDone: "Saqladim, davom etish",
    logout: 'Chiqish', logoutConfirm: "Chiqasizmi? Kirish kalitini saqlab qo'ying, aks holda qaytib kira olmaysiz.",
    phSearch: "@foydalanuvchi nomi yoki ism bo'yicha qidirish",
    noChat: "Chapdan chatni tanlang yoki do'stingizni foydalanuvchi nomi bo'yicha toping",
    phMsg: 'Xabar', emptyChats: "Hozircha chatlar yo'q. Yuqorida do'stingizni foydalanuvchi nomi bo'yicha toping 👆",
    searchResults: 'Qidiruv natijalari', nobody: 'Hech kim topilmadi', firstMsg: 'Birinchi xabarni yozing 👋', you: 'Siz: ',
    callTitle: "Qo'ng'iroq qilish", acceptTitle: 'Qabul qilish', muteTitle: "Mikrofonni o'chirish", endTitle: 'Tugatish',
    callOut: 'Chaqirilmoqda…', callIn: "Kiruvchi qo'ng'iroq…", connecting: 'Ulanmoqda…', offline: 'Foydalanuvchi tarmoqda emas',
    noAnswer: 'Javob yo‘q', ended: "Qo'ng'iroq tugadi", missed: "O'tkazib yuborilgan qo'ng'iroq", rejected: "Qo'ng'iroq rad etildi",
    busy: 'Band', failed: "Ulanib bo'lmadi", lost: 'Aloqa uzildi', callErr: "Qo'ng'iroqda xatolik",
    needHttps: "Qo'ng'iroqlar uchun himoyalangan manzil (https) yoki localhost kerak",
    noMic: "Mikrofonga ruxsat yo'q. Brauzerda ruxsat bering.", netErr: "Server bilan aloqa yo'q", error: 'Xato',
    callTab: "📞 Qo'ng'iroq!", other: 'Русский', otherShort: 'RU'
  }
};
// ответы сервера приходят по-русски — переводим известные
const ERR_UZ = {
  'Введи имя': 'Ismingizni kiriting',
  'Юзернейм: 3–20 символов, латиница, цифры и _': "Foydalanuvchi nomi: 3–20 belgi, lotin harflari, raqamlar va _",
  'Этот юзернейм уже занят': 'Bu foydalanuvchi nomi band',
  'Слишком много попыток, попробуй позже': "Urinishlar juda ko'p, keyinroq urinib ko'ring",
  'Слишком много попыток': "Urinishlar juda ko'p",
  'Неверный ключ': "Kalit noto'g'ri",
  'Не авторизован': 'Avtorizatsiyadan o‘tilmagan',
  'Слишком быстро': 'Juda tez',
  'Пустое сообщение': "Bo'sh xabar",
  'Пользователь не найден': 'Foydalanuvchi topilmadi',
  'Неверный сигнал': "Noto'g'ri signal",
  'Не найдено': 'Topilmadi',
  'Ошибка запроса': "So'rov xatosi"
};
let lang = localStorage.getItem('lang') || ((navigator.language || '').toLowerCase().startsWith('uz') ? 'uz' : 'ru');
if (!I18N[lang]) lang = 'ru';
const t = k => I18N[lang][k] ?? I18N.ru[k] ?? k;
const errText = m => (lang === 'uz' && ERR_UZ[m]) || m;

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t(el.dataset.ph));
  document.querySelectorAll('[data-tt]').forEach(el => el.title = t(el.dataset.tt));
  document.querySelectorAll('.langFull').forEach(b => b.textContent = '🌐 ' + t('other'));
  document.querySelectorAll('.langShort').forEach(b => b.textContent = '🌐 ' + t('otherShort'));
  if (ME && !$('app').classList.contains('hidden')) {
    renderChats();
    if ($('emptyMsg')) $('emptyMsg').textContent = t('firstMsg');
  }
}
document.querySelectorAll('.langBtn').forEach(b => b.onclick = () => {
  lang = lang === 'ru' ? 'uz' : 'ru'; localStorage.setItem('lang', lang); applyLang();
});

let KEY = localStorage.getItem('key') || '';
let ME = null, current = null, chats = [], unread = {}, es = null;

const colors = ['#e17076','#faa774','#a695e7','#7bc862','#6ec9cb','#65aadd','#ee7aae'];
function ava(el, u) {
  const full = (u.name + ' ' + (u.surname || '')).trim();
  el.textContent = (u.name[0] || '?').toUpperCase();
  let h = 0; for (const c of u.username) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  el.style.background = colors[h % colors.length];
  el.title = full;
}
const fullName = u => (u.name + ' ' + (u.surname || '')).trim();
async function api(path, opts = {}) {
  let r;
  try {
    r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY } });
  } catch { throw new Error(t('netErr')); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(errText(data.error) || t('error'));
  return data;
}
const post = (path, obj) => api(path, { method: 'POST', body: JSON.stringify(obj) });

/* ---------- вход / регистрация ---------- */
function showTab(reg) {
  $('regForm').classList.toggle('hidden', !reg); $('loginForm').classList.toggle('hidden', reg);
  $('regForm').style.display = reg ? 'grid' : 'none'; $('loginForm').style.display = reg ? 'none' : 'grid';
  $('tabReg').classList.toggle('on', reg); $('tabLogin').classList.toggle('on', !reg); $('authErr').textContent = '';
}
$('tabReg').onclick = () => showTab(true);
$('tabLogin').onclick = () => showTab(false);

$('regForm').onsubmit = async e => {
  e.preventDefault(); $('authErr').textContent = '';
  try {
    const r = await post('/api/register', { name: $('rName').value, surname: $('rSurname').value, username: $('rUser').value });
    KEY = r.key; ME = r.user; localStorage.setItem('key', KEY);
    $('auth').classList.add('hidden'); $('keyText').textContent = KEY; $('keyScreen').classList.remove('hidden');
  } catch (err) { $('authErr').textContent = err.message; }
};
$('copyKey').onclick = () => { navigator.clipboard?.writeText(KEY); $('copyKey').textContent = t('copied'); };
$('keyDone').onclick = () => { $('keyScreen').classList.add('hidden'); startApp(); };
$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('authErr').textContent = '';
  try {
    const r = await post('/api/login', { key: $('lKey').value });
    KEY = r.key; ME = r.user; localStorage.setItem('key', KEY); startApp();
  } catch (err) { $('authErr').textContent = err.message; }
};
$('logout').onclick = () => { if (confirm(t('logoutConfirm'))) { localStorage.removeItem('key'); location.reload(); } };

/* ---------- приложение ---------- */
async function startApp() {
  if (!ME) { try { ME = await api('/api/me'); } catch { localStorage.removeItem('key'); return location.reload(); } }
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  ava($('meAva'), ME); $('meName').textContent = fullName(ME); $('meUser').textContent = '@' + ME.username;
  await loadChats(); connect();
}
async function loadChats() { chats = await api('/api/chats'); if (!$('q').value.trim()) renderChats(); }

function item(u, sub, badge, on) {
  const d = document.createElement('div'); d.className = 'item' + (on ? ' on' : '');
  const a = document.createElement('div'); a.className = 'ava'; ava(a, u);
  const tt = document.createElement('div'); tt.className = 't';
  const b = document.createElement('b'); b.textContent = fullName(u);
  const s = document.createElement('small'); s.textContent = sub;
  tt.append(b, s); d.append(a, tt);
  if (badge) { const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = badge; d.append(bd); }
  d.onclick = () => openChat(u);
  return d;
}
function renderChats() {
  const l = $('list'); l.textContent = '';
  if (!chats.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('emptyChats'); l.append(e); return; }
  for (const c of chats) {
    const pre = c.last.from === ME.username ? t('you') : '';
    l.append(item(c.user, pre + c.last.text, unread[c.user.username], current?.username === c.user.username));
  }
}
let searchTimer;
$('q').oninput = () => {
  clearTimeout(searchTimer);
  const q = $('q').value.trim();
  if (!q) return renderChats();
  searchTimer = setTimeout(async () => {
    const res = await api('/api/users?q=' + encodeURIComponent(q)).catch(() => []);
    const l = $('list'); l.textContent = '';
    const lb = document.createElement('div'); lb.className = 'label'; lb.textContent = t('searchResults'); l.append(lb);
    if (!res.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('nobody'); l.append(e); }
    res.forEach(u => l.append(item(u, '@' + u.username)));
  }, 250);
};

async function openChat(u) {
  current = u; unread[u.username] = 0;
  $('q').value = ''; renderChats();
  $('noChat').style.display = 'none'; $('chatBox').style.display = 'flex';
  $('app').classList.add('chatting');
  ava($('hAva'), u); $('hName').textContent = fullName(u); $('hUser').textContent = '@' + u.username;
  const msgs = await api('/api/messages?with=' + encodeURIComponent(u.username));
  $('msgs').textContent = '';
  if (!msgs.length) { const e = document.createElement('div'); e.className = 'empty'; e.id = 'emptyMsg'; e.textContent = t('firstMsg'); $('msgs').append(e); }
  msgs.forEach(addMsg); $('text').focus();
}
$('back').onclick = () => { current = null; $('app').classList.remove('chatting'); renderChats(); };

function addMsg(m) {
  $('emptyMsg')?.remove();
  const d = document.createElement('div'); d.className = 'm' + (m.from === ME.username ? ' mine' : '');
  d.textContent = m.text;
  const tm = document.createElement('time');
  tm.textContent = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  d.append(tm); $('msgs').append(d); $('msgs').scrollTop = $('msgs').scrollHeight;
}
$('sendForm').onsubmit = async e => {
  e.preventDefault();
  const text = $('text').value.trim(); if (!text || !current) return;
  $('text').value = '';
  try { await post('/api/send', { to: current.username, text }); } catch (err) { alert(err.message); $('text').value = text; }
};

function connect() {
  es?.close();
  es = new EventSource('/api/stream?key=' + encodeURIComponent(KEY));
  es.addEventListener('signal', ev => onSignal(JSON.parse(ev.data)));
  es.addEventListener('message', ev => {
    const { message: m, user } = JSON.parse(ev.data);
    const other = m.from === ME.username ? m.to : m.from;
    if (current?.username === other) addMsg(m);
    else if (m.from !== ME.username) { unread[other] = (unread[other] || 0) + 1; document.title = '● ' + t('title'); }
    chats = chats.filter(c => c.user.username !== other); chats.unshift({ user, last: m });
    if (!$('q').value.trim()) renderChats();
  });
  es.onopen = () => { if (current) openChat(current); else loadChats(); };
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = t('title'); });

/* ---------- голосовые звонки (WebRTC) ---------- */
const RTC_CFG = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };
let call = null; // { peer:user, pc, stream, role:'caller'|'callee', pendingIce:[], offer, timer, ring }
let sigQ = Promise.resolve();
const sendSignal = (to, type, data) => { sigQ = sigQ.then(() => post('/api/signal', { to, type, data })).catch(() => ({})); return sigQ; };

function ringtone(on) {
  try {
    if (call?.ring) { clearInterval(call.ring.iv); call.ring.ctx.close(); call.ring = null; }
    if (!on) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => { const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 440; g.gain.value = 0.08; o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.4); };
    beep(); call.ring = { ctx, iv: setInterval(beep, 1500) };
  } catch {}
}
function showCall(status, mode) { // mode: incoming | active
  $('call').classList.remove('hidden');
  ava($('cAva'), call.peer); $('cName').textContent = fullName(call.peer); $('cStatus').textContent = status;
  $('cAccept').classList.toggle('hidden', mode !== 'incoming');
  $('cMute').classList.toggle('hidden', mode === 'incoming');
}
function endCall(status) {
  if (!call) return;
  const c = call; ringtone(false); clearTimeout(c.timer); clearInterval(c.tick);
  c.pc?.close(); c.stream?.getTracks().forEach(tr => tr.stop());
  $('remoteAudio').srcObject = null; call = null;
  if (status) { $('call').classList.remove('hidden'); ava($('cAva'), c.peer); $('cName').textContent = fullName(c.peer);
    $('cStatus').textContent = status; $('cAccept').classList.add('hidden'); $('cMute').classList.add('hidden');
    setTimeout(() => { if (!call) $('call').classList.add('hidden'); }, 1800); }
  else $('call').classList.add('hidden');
  $('cMute').classList.remove('on'); $('cMute').textContent = '🎤';
}
async function getMic() {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error(t('needHttps'));
  try { return await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false }); }
  catch { throw new Error(t('noMic')); }
}
function flushIce() {
  if (!call) return;
  call.sdpSent = true;
  for (const c of call.localIce) sendSignal(call.peer.username, 'ice', c);
  call.localIce = [];
}
function makePeer() {
  const pc = new RTCPeerConnection(RTC_CFG);
  call.pc = pc;
  call.stream.getTracks().forEach(tr => pc.addTrack(tr, call.stream));
  call.localIce = []; call.sdpSent = false;
  pc.onicecandidate = e => {
    if (!e.candidate || !call) return;
    if (call.sdpSent) sendSignal(call.peer.username, 'ice', e.candidate); // сначала offer/answer, потом кандидаты
    else call.localIce.push(e.candidate);
  };
  pc.ontrack = e => { $('remoteAudio').srcObject = e.streams[0]; $('remoteAudio').play().catch(() => {}); };
  pc.onconnectionstatechange = () => {
    if (!call || call.pc !== pc) return;
    const s = pc.connectionState;
    if (s === 'connected') {
      ringtone(false); clearTimeout(call.timer); call.t0 = Date.now(); showCall('00:00', 'active');
      call.tick = setInterval(() => { const sec = Math.floor((Date.now() - call.t0) / 1000);
        $('cStatus').textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }, 1000);
    } else if (s === 'failed') { sendSignal(call.peer.username, 'hangup'); endCall(t('failed')); }
    else if (s === 'disconnected') { const c = call; setTimeout(() => { if (call === c && pc.connectionState !== 'connected') endCall(t('lost')); }, 6000); }
  };
  return pc;
}
async function startCall() {
  if (!current || call) return;
  let stream;
  try { stream = await getMic(); } catch (e) { return alert(e.message); }
  call = { peer: current, role: 'caller', stream, pendingIce: [] };
  showCall(t('callOut'), 'active');
  try {
    const pc = makePeer();
    const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
    const p = sendSignal(call.peer.username, 'offer', { type: offer.type, sdp: offer.sdp });
    flushIce();
    const r = await p;
    if (!call) return;
    if (r && r.delivered === false) { endCall(t('offline')); return; }
    call.timer = setTimeout(() => { if (call && !call.t0) { sendSignal(call.peer.username, 'hangup'); endCall(t('noAnswer')); } }, 40000);
  } catch { endCall(t('callErr')); }
}
async function acceptCall() {
  if (!call || call.role !== 'callee' || call.pc) return;
  ringtone(false);
  try { call.stream = await getMic(); }
  catch (e) { alert(e.message); sendSignal(call.peer.username, 'reject'); return endCall(); }
  try {
    const pc = makePeer();
    await pc.setRemoteDescription(call.offer);
    for (const c of call.pendingIce) await pc.addIceCandidate(c).catch(() => {});
    call.pendingIce = [];
    const answer = await pc.createAnswer(); await pc.setLocalDescription(answer);
    showCall(t('connecting'), 'active');
    sendSignal(call.peer.username, 'answer', { type: answer.type, sdp: answer.sdp });
    flushIce();
  } catch { sendSignal(call.peer.username, 'hangup'); endCall(t('callErr')); }
}
async function onSignal({ from, type, data }) {
  if (type === 'offer') {
    if (call) return sendSignal(from.username, 'busy');
    call = { peer: from, role: 'callee', offer: data, pendingIce: [] };
    showCall(t('callIn'), 'incoming'); ringtone(true);
    call.timer = setTimeout(() => { if (call && !call.pc) endCall(); }, 45000);
    if (document.hidden) document.title = t('callTab');
    return;
  }
  if (!call || call.peer.username !== from.username) return;
  if (type === 'answer' && call.pc) { await call.pc.setRemoteDescription(data).catch(() => {});
    for (const c of call.pendingIce) await call.pc.addIceCandidate(c).catch(() => {}); call.pendingIce = []; }
  else if (type === 'ice') {
    if (call.pc && call.pc.remoteDescription) await call.pc.addIceCandidate(data).catch(() => {});
    else call.pendingIce.push(data);
  }
  else if (type === 'hangup') endCall(call.t0 ? t('ended') : (call.role === 'callee' ? t('missed') : t('ended')));
  else if (type === 'reject') endCall(t('rejected'));
  else if (type === 'busy') endCall(t('busy'));
}
$('callBtn').onclick = startCall;
$('cAccept').onclick = acceptCall;
$('cEnd').onclick = () => {
  if (!call) return;
  const peer = call.peer.username;
  if (call.role === 'callee' && !call.pc) { sendSignal(peer, 'reject'); endCall(); }
  else { sendSignal(peer, 'hangup'); endCall(call.t0 ? t('ended') : null); }
};
$('cMute').onclick = () => {
  if (!call?.stream) return;
  const tr = call.stream.getAudioTracks()[0]; if (!tr) return;
  tr.enabled = !tr.enabled; $('cMute').classList.toggle('on', !tr.enabled); $('cMute').textContent = tr.enabled ? '🎤' : '🔇';
};

applyLang();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
if (KEY) startApp(); else showTab(true);
</script>
